<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>MARELCO · Member App</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@300;400;500;600;700&family=IBM+Plex+Serif:ital,wght@0,400;0,700;1,400&family=IBM+Plex+Mono:wght@400;500;600&family=Instrument+Serif:ital@0;1&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
  <style>
    *, *::before, *::after { box-sizing: border-box; }

    /* ── Accessibility: type scale anchor ──
       Every font-size in this app is expressed in rem, so changing this one
       value scales the whole interface. The in-app "Text size" control
       (Normal / Large / Larger) overwrites it and persists to localStorage. */
    html { font-size: 16px; }
    body { margin: 0; background: #d6d2cc; font-family: 'IBM Plex Sans', system-ui, sans-serif; min-height: 100vh; }

    /* ── Canvas wrapper ── */
    .canvas { display: flex; flex-direction: column; align-items: center; padding: 28px 16px 56px; gap: 20px; }

    /* ── Android phone body ── */
    .phone-body {
      width: 390px;
      background: #fff;
      border-radius: 42px;
      overflow: hidden;
      box-shadow: 0 0 0 10px #1a1a1a, 0 28px 72px rgba(0,0,0,0.55);
      display: flex;
      flex-direction: column;
    }

    /* ── Android status bar ── */
    .android-status {
      background: #fff;
      display: flex; align-items: center; justify-content: space-between;
      padding: 10px 20px 4px;
      font-size: 0.875rem; font-weight: 700;
      font-family: 'IBM Plex Sans', system-ui, sans-serif;
    }
    .android-status .time { font-size: 0.875rem; font-weight: 700; color: #111; }
    .android-status .sys-icons { display: flex; align-items: center; gap: 4px; }

    /* ── Chrome URL bar ── */
    .chrome-urlbar {
      background: #fff;
      padding: 4px 12px 8px;
      display: flex; align-items: center; gap: 8px;
    }
    .chrome-url-pill {
      flex: 1; background: #f1f3f4; border-radius: 999px;
      height: 42px; display: flex; align-items: center;
      padding: 0 14px; gap: 7px; min-width: 0;
    }
    .chrome-url-pill .lock-icon { color: #5f6368; font-size: 0.75rem; flex-shrink: 0; }
    .chrome-url-pill .url-text {
      font-size: 1rem; color: #202124; font-family: 'IBM Plex Sans', system-ui, sans-serif;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis; flex: 1; font-weight: 400;
    }
    .chrome-url-pill .url-text strong { font-weight: 700; }
    .chrome-tab-btn {
      width: 34px; height: 34px; border-radius: 8px; border: 2.5px solid #5f6368;
      display: flex; align-items: center; justify-content: center;
      font-size: 0.75rem; font-weight: 800; color: #5f6368;
      font-family: 'IBM Plex Mono', monospace; flex-shrink: 0; cursor: pointer;
      background: transparent;
    }
    .chrome-more { font-size: 1.25rem; color: #5f6368; cursor: pointer; padding: 4px; line-height: 1; flex-shrink: 0; }

    /* ── Content area ── */
    .site {
      height: 652px;
      overflow-y: auto; overflow-x: hidden; background: #fff; scroll-behavior: smooth;
    }
    .site::-webkit-scrollbar { width: 3px; }
    .site::-webkit-scrollbar-thumb { background: #c9c5bd; border-radius: 99px; }

    /* ── Chrome bottom bar ── */
    .chrome-bottom {
      background: #fff; border-top: 1px solid #e8e8e8;
      display: flex; align-items: center; justify-content: space-around;
      padding: 6px 4px 2px;
    }
    .chrome-bottom button {
      background: none; border: none; cursor: pointer; padding: 8px 10px;
      display: flex; flex-direction: column; align-items: center; font-size: 1.25rem;
      color: #5f6368; border-radius: 8px;
    }
    .chrome-bottom button:disabled { opacity: 0.3; cursor: default; }
    .chrome-bottom .tab-badge {
      width: 26px; height: 26px; border-radius: 6px; border: 2px solid #5f6368;
      display: flex; align-items: center; justify-content: center;
      font-size: 0.75rem; font-weight: 800; color: #5f6368;
      font-family: 'IBM Plex Mono', monospace;
    }

    /* ── Android gesture nav ── */
    .android-gesture {
      background: #fff; padding: 8px 0 10px;
      display: flex; align-items: center; justify-content: center;
    }
    .gesture-pill {
      width: 130px; height: 5px; border-radius: 999px; background: #111;
    }

    /* ── Site-wide nav ── */
    .site-nav {
      position: sticky; top: 0; z-index: 50;
      background: var(--eko-nav, #0E2A47); color: #fff;
      padding: 0 18px;
      display: flex; align-items: center; gap: 10px; height: 54px;
    }
    .nav-logo { display: flex; align-items: center; gap: 9px; flex: 1; text-decoration: none; color: inherit; }
    .nav-logo-text { font-weight: 700; font-size: 1rem; letter-spacing: 0.02em; }
    .nav-menu-btn {
      background: none; border: none; color: #fff; cursor: pointer; padding: 8px;
      display: flex; flex-direction: column; gap: 4px; align-items: center;
    }
    .nav-menu-btn span { display: block; width: 20px; height: 2px; background: #fff; border-radius: 1px; }
    .nav-sign-btn {
      background: #F4C842; color: #0E2A47; border: none; border-radius: 6px;
      padding: 7px 14px; font-weight: 700; font-size: 0.875rem; cursor: pointer;
      font-family: inherit; white-space: nowrap;
    }

    /* ── Slide-out menu ── */
    .menu-overlay {
      position: absolute; inset: 0; background: rgba(14,42,71,0.55); z-index: 100;
    }
    .menu-drawer {
      position: absolute; top: 0; right: 0; bottom: 0; width: 82%;
      background: #fff; z-index: 101; display: flex; flex-direction: column;
      overflow-y: auto;
    }
    .menu-drawer::-webkit-scrollbar { width: 0; }
    .menu-header {
      background: var(--eko-nav, #0E2A47); color: #fff; padding: 14px 18px;
      display: flex; align-items: center; justify-content: space-between;
    }
    .menu-close {
      background: none; border: none; color: #fff; font-size: 1.375rem;
      cursor: pointer; padding: 0; line-height: 1;
    }
    .menu-section-title {
      font-size: 0.75rem; font-weight: 700; letter-spacing: 0.12em; text-transform: uppercase;
      color: #5F6B62; padding: 14px 18px 6px;
    }
    .menu-item {
      display: flex; align-items: center; gap: 12px;
      padding: 13px 18px; font-size: 1rem; font-weight: 500; color: #111418;
      border-bottom: 1px solid #f0eeeb; cursor: pointer; background: none;
      border-left: none; border-right: none; border-top: none; font-family: inherit;
      text-align: left; width: 100%;
    }
    .menu-item:hover { background: var(--eko-surface, #F4F1EA); }
    .menu-item.active { color: #0E2A47; font-weight: 700; background: #E4EBF3; }
    .menu-item-icon { font-size: 1.125rem; width: 28px; text-align: center; flex-shrink: 0; }

    /* ── Status banner ── */
    .status-warn { background: #FBEFD9; border-bottom: 2px solid #A85B00; padding: 10px 18px; display: flex; align-items: center; gap: 10px; }
    .status-dot { width: 26px; height: 26px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-weight: 800; font-size: 0.875rem; flex-shrink: 0; }

    /* ── Section helpers ── */
    .section { padding: 24px 18px; }
    .section-label { font-size: 0.75rem; font-weight: 700; letter-spacing: 0.12em; text-transform: uppercase; color: #1F66C2; margin-bottom: 6px; }
    .section-title { font-size: 1.375rem; font-weight: 700; color: #0E2A47; margin: 0 0 10px; line-height: 1.2; letter-spacing: -0.01em; }
    .section-body { font-size: 1rem; line-height: 1.6; color: #111418; opacity: 0.85; margin: 0; }

    /* ── Cards ── */
    .card-list { display: flex; flex-direction: column; gap: 10px; }
    .card { background: #fff; border: 1.5px solid #C9C5BD; border-radius: 12px; padding: 14px; }
    .card-marble { background: var(--eko-surface, #F4F1EA); border-color: transparent; }

    /* ── Buttons ── */
    .btn-gold { background: #F4C842; color: #0E2A47; border: none; border-radius: 10px; padding: 14px 18px; font-weight: 700; font-size: 1rem; cursor: pointer; font-family: inherit; width: 100%; min-height: 52px; }
    .btn-outline { background: #fff; color: #0E2A47; border: 2px solid #0E2A47; border-radius: 10px; padding: 12px 18px; font-weight: 600; font-size: 1rem; cursor: pointer; font-family: inherit; width: 100%; min-height: 48px; }
    .btn-primary { background: #1F66C2; color: #fff; border: none; border-radius: 10px; padding: 14px 18px; font-weight: 700; font-size: 1rem; cursor: pointer; font-family: inherit; width: 100%; min-height: 52px; }

    /* ── Rate table ── */
    .rate-table { width: 100%; border-collapse: collapse; font-size: 0.875rem; }
    .rate-table th { background: var(--eko-nav, #0E2A47); color: #fff; padding: 9px 10px; text-align: left; font-weight: 600; font-size: 0.875rem; }
    .rate-table td { padding: 9px 10px; border-bottom: 1px solid #e8e4de; color: #111418; }
    .rate-table tr:last-child td { border-bottom: none; }
    .rate-table tr:nth-child(even) td { background: var(--eko-surface, #F4F1EA); }
    .rate-table .num { font-family: 'IBM Plex Mono', monospace; text-align: right; font-weight: 500; }
    .rate-table .total td { background: #E4EBF3; font-weight: 700; color: #0E2A47; border-top: 2px solid #0E2A47; }

    /* ── Tab strip ── */
    .tabs { display: flex; border-bottom: 2px solid #e8e4de; overflow-x: auto; }
    .tabs::-webkit-scrollbar { height: 0; }
    .tab { padding: 10px 16px; font-size: 0.875rem; font-weight: 600; color: #5F6B62; cursor: pointer; white-space: nowrap; border-bottom: 2.5px solid transparent; margin-bottom: -2px; background: none; border-top: none; border-left: none; border-right: none; font-family: inherit; }
    .tab.active { color: #0E2A47; border-bottom-color: #0E2A47; }

    /* ── News card ── */
    .news-tag { display: inline-block; padding: 3px 9px; border-radius: 4px; font-size: 0.75rem; font-weight: 700; letter-spacing: 0.03em; color: #fff; margin-bottom: 7px; }

    /* ── Form ── */
    .form-label { display: block; font-size: 0.875rem; font-weight: 600; color: #0E2A47; margin-bottom: 6px; }
    .form-input { width: 100%; padding: 12px 14px; border: 2px solid #C9C5BD; border-radius: 9px; font-size: 1rem; font-family: 'IBM Plex Sans', system-ui, sans-serif; color: #111418; background: #fff; outline: none; }
    .form-input:focus { border-color: #1F66C2; }
    .form-hint { font-size: 0.75rem; color: #5F6B62; margin-top: 5px; line-height: 1.4; }

    /* ── OTP ── */
    .otp-box { width: 42px; height: 50px; border: 2px solid #C9C5BD; border-radius: 9px; font-size: 1.375rem; font-weight: 700; text-align: center; font-family: 'IBM Plex Mono', monospace; color: #0E2A47; outline: none; }
    .otp-box:focus { border-color: #1F66C2; }

    /* ── Step dots ── */
    .step-dots { display: flex; gap: 6px; justify-content: center; padding: 8px 0 4px; }
    .step-dot { height: 7px; border-radius: 999px; background: #C9C5BD; transition: all 0.2s; }

    /* ── Page nav pills ── */
    .page-nav { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; }
    .page-pill { padding: 7px 14px; border-radius: 999px; border: none; cursor: pointer; font-family: inherit; font-weight: 600; font-size: 0.875rem; box-shadow: 0 2px 6px rgba(0,0,0,0.14); transition: all 0.15s; }

    /* ── Footer ── */
    .site-footer { background: var(--eko-nav, #0E2A47); color: #fff; padding: 24px 18px 32px; }

    /* ── Dashboard host ── */
    .dashboard-host { height: 100%; display: flex; flex-direction: column; }
    .dashboard-host [data-theme] { flex: 1; display: flex; flex-direction: column; min-height: 0; }

    /* ── Bill PDF view ── */
    .bill-pdf { padding: 22px 20px 28px; font-size: 0.75rem; line-height: 1.4; }
    .bill-pdf h2 { font-size: 0.75rem; font-weight: 700; letter-spacing: 0.12em; text-transform: uppercase; color: #1F66C2; margin: 18px 0 6px; padding-bottom: 4px; border-bottom: 1.5px solid #E2E6EA; }
    .bill-pdf .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 6px 14px; }
    .bill-pdf .grid2 .lbl { font-size: 0.75rem; color: #5F6B62; letter-spacing: 0.02em; }
    .bill-pdf .grid2 .val { font-size: 0.875rem; color: #0E2A47; font-weight: 600; }
    .bill-pdf table { width: 100%; border-collapse: collapse; margin-top: 4px; }
    .bill-pdf table td { padding: 5px 6px; font-size: 0.75rem; border-bottom: 1px solid #EDF0F3; }
    .bill-pdf table tr.tot td { font-weight: 700; color: #0E2A47; background: #E4EBF3; border-top: 2px solid #0E2A47; padding: 8px 6px; font-size: 0.875rem; }
    .bill-pdf .num { font-family: 'IBM Plex Mono', monospace; text-align: right; }
    .bill-pdf .pdf-hero { background: var(--eko-nav, #0E2A47); color: #fff; padding: 16px 18px; border-radius: 10px; margin-bottom: 12px; display: flex; align-items: center; gap: 14px; }
    .bill-pdf .pdf-hero .logo { width: 48px; height: 48px; border-radius: 50%; background: #fff; padding: 3px; flex-shrink: 0; }
    .bill-pdf .amt-due { background: #F4C842; color: #0E2A47; padding: 14px 18px; border-radius: 10px; margin: 12px 0; display: flex; align-items: center; justify-content: space-between; }
    .bill-pdf .amt-due .v { font-family: 'IBM Plex Mono', monospace; font-size: 1.625rem; font-weight: 700; }
    .bill-pdf .qr-box { width: 88px; height: 88px; background: repeating-linear-gradient(45deg, #0E2A47 0 4px, #fff 4px 8px); border-radius: 4px; flex-shrink: 0; }
    @media print {
      body, html { background: #fff !important; margin: 0; padding: 0; }
      .canvas, .phone-body, .android-status, .chrome-urlbar, .chrome-bottom, .android-gesture, .page-nav, .pdf-actions { display: none !important; }
      .bill-pdf { padding: 0 !important; font-size: 0.75rem; }
      .bill-pdf .pdf-hero, .bill-pdf .amt-due { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
      .bill-pdf-host { display: block !important; width: 100% !important; height: auto !important; min-height: 0 !important; position: static !important; }
    }

    /* ── Real-phone mode (≤600px viewport): strip the mock phone chrome ── */
    @media (max-width: 600px) {
      body { background: #fff !important; }
      .canvas { padding: 0 !important; gap: 0 !important; min-height: 100vh; }
      .phone-body {
        width: 100% !important;
        border-radius: 0 !important;
        box-shadow: none !important;
        min-height: 100vh;
      }
      .android-status,
      .chrome-urlbar,
      .chrome-bottom,
      .android-gesture { display: none !important; }
      .site { height: 100vh !important; height: 100dvh !important; }
      .page-nav { display: none !important; }
    }
  </style>
  <style>
    /* EcoKo master brand — GREEN. Overrides the neutral "utility" tenant so the
       app matches the EcoKo admin dashboard. Brand brief: one strong accent,
       avoid blue+yellow (poor for aging eyes). Scoped to this file only. */
    :root{ --eko-primary:#2E6CB4; --eko-primary-2:#43B649; --eko-accent:#43B649; }
    [data-tenant="utility"]{
      --primary:      var(--eko-primary);
      --primary-2:    var(--eko-primary-2);
      --accent:       var(--eko-accent);
      --accent-soft:  color-mix(in srgb, var(--eko-accent) 16%, #fff);
      --primary-soft: color-mix(in srgb, var(--eko-primary) 12%, #fff);
      --bg-elev:      #F4F9F5;
      --line:         #D5E5D8;
      --line-2:       #E6F0E7;
    }

    /* Gentle bob for the "scroll for more" hint */
    @keyframes ekoScrollNudge { 0%,100% { transform: translateX(-50%) translateY(0); } 50% { transform: translateX(-50%) translateY(4px); } }
  </style>
</head>

/* ── Site Nav (shared, sticky) ─────────────────── */
function SiteNav({ nav, currentPage, loggedIn }) {
  const [open, setOpen] = useState(false);
  const [overlayTop, setOverlayTop] = useState(0);
  const go = (p) => { nav(p); setOpen(false); };

  const openMenu = () => {
    const site = document.querySelector('.site');
    setOverlayTop(site ? site.scrollTop : 0);
    setOpen(true);
  };

  useEffect(() => {
    const site = document.querySelector('.site');
    if (site) site.style.overflowY = open ? 'hidden' : 'auto';
    return () => { if (site) site.style.overflowY = 'auto'; };
  }, [open]);

  const menuItems = [
    {icon:'🏠', label:'Home',                   page:'home'},
    {icon:'₱',  label:'Residential Rates',       page:'rates-residential', section:'Rates'},
    {icon:'⚡', label:'Generation Rate',          page:'rates-generation'},
    {icon:'📋', label:'Schedule of Unbundled Rates', page:'rates-unbundled'},
    {icon:'📰', label:'News & Events',            page:'news', section:'Public Info'},
    {icon:'🏢', label:'About the Cooperative',   page:'about'},
    {icon:'📞', label:'Contact Us',              page:'contact'},
  ];

  return (
    <>
      <nav className="site-nav">
        <button className="nav-logo" onClick={()=>go('signin')} style={{background:'none',border:'none',cursor:'pointer',display:'flex',alignItems:'center',gap:9,padding:0}}>
          <Logo size={34} white/>
        </button>
      </nav>

      {open && (
        <div style={{position:'absolute',top:overlayTop,left:0,right:0,height:652,zIndex:100}}>
          <div className="menu-overlay" onClick={()=>setOpen(false)}/>
          <div className="menu-drawer">
            <div className="menu-header">
              <div style={{display:'flex',alignItems:'center',gap:10}}>
                <Logo size={32} white/>
              </div>
              <button className="menu-close" onClick={()=>setOpen(false)}>×</button>
            </div>

            {/* Member CTA */}
            <div style={{padding:'14px 18px',borderBottom:`1px solid ${C.rule}`,display:'flex',flexDirection:'column',gap:8}}>
              <button className="btn-gold" style={{fontSize:'1rem',minHeight:44}} onClick={()=>go('signin')}>Sign in to my account →</button>
              <button className="btn-outline" style={{fontSize:'0.875rem',minHeight:40}} onClick={()=>go('register')}>Create a new account</button>
            </div>

            {(() => {
              let lastSection = null;
              return menuItems.map(item => {
                const showSection = item.section && item.section !== lastSection;
                if(item.section) lastSection = item.section;
                return (
                  <React.Fragment key={item.page}>
                    {showSection && <div className="menu-section-title">{item.section}</div>}
                    <button className={`menu-item ${currentPage===item.page?'active':''}`} onClick={()=>go(item.page)}>
                      <span className="menu-item-icon">{item.icon}</span>
                      {item.label}
                    </button>
                  </React.Fragment>
                );
              });
            })()}

            <div style={{flex:1}}/>
            <Hotline/>
          </div>
        </div>
      )}
    </>
  );
}

function PageSignIn({ nav }) {
  const [type, setType] = useState('personal');
  const [form, setForm] = useState({id:'',pass:''});
  const [error, setError] = useState('');

  const isBiz = type === 'business';

  const switchType = (t) => { setType(t); setForm({id:'',pass:''}); setError(''); };

  const submit = () => {
    const id = form.id.trim().toLowerCase();
    if (isBiz) {
      const validBizIds = ['biz@santosco.com', 'biz-00456'];
      if (validBizIds.includes(id) && form.pass === 'password') {
        setError(''); nav('business-dashboard');
      } else {
        setError('Incorrect business ID or password. Try the demo credentials below.');
      }
    } else {
      const validIds = [BRAND.demoEmail, BRAND.demoAccountNo.toLowerCase(), BRAND.demoAccountNo.split('-')[1]];
      if (validIds.includes(id) && form.pass === 'password') {
        setError(''); nav('dashboard');
      } else {
        setError('Incorrect email/account number or password. Try the demo credentials below.');
      }
    }
  };

  return (
    <div>
      <div style={{padding:'28px 18px 24px',background:C.marble,borderBottom:`1px solid ${C.rule}`}}>
        <Logo size={52}/>
        <h2 style={{margin:'14px 0 14px',fontSize:'1.375rem',fontWeight:700,color:C.ocean}}>Sign in</h2>

        {/* Personal / Business toggle */}
        <div style={{display:'flex',background:'#E8E4DC',borderRadius:10,padding:3,gap:3}}>
          {['personal','business'].map(t=>(
            <button key={t} onClick={()=>switchType(t)} style={{
              flex:1,padding:'9px 0',borderRadius:8,border:'none',cursor:'pointer',fontFamily:'inherit',
              fontSize:'0.875rem',fontWeight:700,transition:'all 0.15s',
              background: type===t ? '#fff' : 'transparent',
              color: type===t ? C.ocean : C.ink,
              boxShadow: type===t ? '0 1px 4px rgba(0,0,0,0.12)' : 'none',
            }}>
              {t==='personal' ? '👤 Personal' : '🏢 Business'}
            </button>
          ))}
        </div>

        {isBiz ? (
          <p style={{margin:'10px 0 0',fontSize:'0.875rem',color:C.current,fontWeight:500,lineHeight:1.45}}>
            Manage bills across all your properties and accounts in one place.
          </p>
        ) : (
          <p style={{margin:'10px 0 0',fontSize:'1rem',color:C.ink,opacity:.75}}>Use your account number or registered email.</p>
        )}
      </div>

      <div style={{padding:'20px 18px'}}>
        <div style={{marginBottom:14}}>
          <label className="form-label">{isBiz ? 'Business email or business account ID' : 'Account number or email address'}</label>
          <input className="form-input"
            placeholder={isBiz ? `e.g. ${BRAND.demoBizEmail} or ${BRAND.demoBizId}` : `e.g. ${BRAND.demoAccountNo} or email@example.com`}
            value={form.id} onChange={e=>{setForm({...form,id:e.target.value}); setError('');}}/>
          <div className="form-hint">{isBiz ? `Your business account ID is on your ${BRAND.companyName} billing agreement.` : 'Your account number is printed on the top-right of your paper bill.'}</div>
        </div>
        <div style={{marginBottom:6}}>
          <label className="form-label">Password</label>
          <input className="form-input" type="password" placeholder="Enter your password"
            value={form.pass} onChange={e=>{setForm({...form,pass:e.target.value}); setError('');}}
            onKeyDown={e=>{if(e.key==='Enter') submit();}}/>
        </div>
        {error && (

/* ── Business: Pay screen ── */
function BizPayScreen({ accounts, activeIdx, nav, onPaid }) {
  const acc = accounts[activeIdx];
  const [stage, setStage] = useState('select');
  const groups = [
    { title:'E-wallets', items:[
      { id:'gcash', name:'GCash',          sub:'09•• ••• 4567',            fee:0, tag:'Recommended' },
      { id:'maya',  name:'Maya',           sub:'Linked wallet',            fee:0 },
    ]},
    { title:'Bank & card', items:[
      { id:'bank',  name:'Online banking', sub:'BPI · UnionBank · BDO · 12 more', fee:5 },
      { id:'card',  name:'Credit or debit card', sub:'Visa · Mastercard',   fee:25 },
    ]},
    { title:'QR Ph', items:[
      { id:'qrph',  name:'QR Ph',          sub:'Scan or show a code · any bank or e-wallet', fee:0 },
    ]},
    { title:'Over the counter', items:[
      { id:'otc',   name:'Cash payment',   sub:'7-Eleven · Bayad Center · M Lhuillier', fee:15 },
    ]},
  ];
  const channels = groups.flatMap(g => g.items);
  const [picked, setPicked] = useState('gcash');
  const [qrMode, setQrMode] = useState('show');   /* show | scan */
  const [scan, setScan] = useState('idle');       /* idle | scanning | found */
  const sel   = channels.find(c => c.id === picked);
  const fee   = sel ? sel.fee : 0;
  const total = acc.amount + fee;

  if (stage === 'success') return <BizPaySuccess acc={acc} nav={nav} method={sel} onPaid={()=>onPaid(activeIdx)}/>;

  return (
    <div className="eko-screen screen-enter">
      <ScreenHeader title="Pay bill" onBack={()=>nav('bill')}/>
      <div className="scroll" style={{ padding:'4px 18px 24px' }}>
        <div className="card" style={{ padding:18, background:'var(--primary-soft)', borderColor:'transparent' }}>
          <div className="eyebrow" style={{ color:'var(--primary)' }}>Paying</div>
          <div className="amount" style={{ fontSize:'2.625rem', lineHeight:1, color:'var(--primary)' }}>₱{acc.amount.toFixed(2)}</div>
          <div style={{ marginTop:6, fontSize:'0.875rem', color:'var(--primary)' }}>
            April bill · <span className="mono">{acc.no}</span> · {acc.label}
          </div>
        </div>

        <div className="eyebrow" style={{ marginTop:22 }}>Choose payment method</div>
        {groups.map(g => (
          <div key={g.title}>
            <div style={{ fontSize:'0.75rem', fontWeight:700, color:'var(--ink-3)', textTransform:'uppercase', letterSpacing:'0.06em', margin:'14px 0 6px' }}>{g.title}</div>
            <div className="card">
              {g.items.map((c, i) => (
                <label key={c.id} className="row" style={{ borderTop: i ? '1px solid var(--line)' : 'none' }}>
                  <div style={{ display:'flex', gap:12, alignItems:'center', minWidth:0 }}>
                    <span style={{ width:18, height:18, borderRadius:999, border:`2px solid ${picked===c.id ? 'var(--primary)' : 'var(--line)'}`, display:'flex', alignItems:'center', justifyContent:'center', flex:'0 0 auto' }}>
                      {picked===c.id && <span style={{ width:8, height:8, background:'var(--primary)', borderRadius:999 }}/>}
                    </span>
                    <div style={{ minWidth:0 }}>
                      <div style={{ fontWeight:600, fontSize:'1rem', display:'flex', alignItems:'center', gap:8 }}>
                        {c.name}
                        {c.tag && <span className="pill pill-ok" style={{ fontSize:'0.75rem' }}>{c.tag}</span>}
                      </div>
                      <div style={{ fontSize:'0.875rem', color:'var(--ink-3)' }}>{c.sub}</div>
                    </div>
                  </div>
                  <div style={{ fontSize:'0.875rem', color:c.fee?'var(--accent)':'var(--ink-3)' }}>{c.fee?'+₱'+c.fee:'No fee'}</div>
                  <input type="radio" name="bpay" checked={picked===c.id} onChange={()=>{setPicked(c.id); setScan('idle');}} style={{ display:'none' }}/>
                </label>
              ))}
            </div>
          </div>
        ))}

        {/* QR Ph panel */}
        {picked==='qrph' && (
          <div className="card" style={{ padding:16, marginTop:14 }}>
            <div style={{ display:'flex', gap:6, marginBottom:14 }}>
              {[['show','Show my code'],['scan','Scan a code']].map(([m,lb])=>(
                <button key={m} onClick={()=>{setQrMode(m); setScan('idle');}} style={{
                  flex:1, padding:'8px 0', borderRadius:10, cursor:'pointer', fontFamily:'inherit', fontSize:'0.75rem', fontWeight:700,
                  border:'1px solid '+(qrMode===m?'var(--primary)':'var(--line)'),
                  background: qrMode===m?'var(--primary)':'var(--bg-elev)', color: qrMode===m?'#fff':'var(--ink-2)',
                }}>{lb}</button>
              ))}
            </div>
            {qrMode==='show' ? (
              <div style={{ textAlign:'center' }}>
                <div style={{ display:'inline-block', padding:12, border:'1px solid var(--line)', borderRadius:14, background:'#fff' }}>
                  <QRPhCode seed={acc.no + acc.amount.toFixed(2)}/>
                </div>
                <div style={{ fontWeight:700, fontSize:'0.8125rem', marginTop:12 }}>{BRAND.companyName}</div>
                <div style={{ fontSize:'0.75rem', color:'var(--ink-3)', marginTop:2 }}>{acc.no} · {acc.label} · ₱{acc.amount.toFixed(2)}</div>
                <p style={{ fontSize:'0.75rem', color:'var(--ink-3)', marginTop:10, lineHeight:1.5 }}>Open any QR Ph–enabled bank or e-wallet app and scan this code. The amount is already filled in.</p>
              </div>
            ) : (
              <div style={{ textAlign:'center' }}>
                <div style={{ position:'relative', width:'100%', maxWidth:250, aspectRatio:'1', margin:'0 auto', borderRadius:14, overflow:'hidden',
                              background: scan==='found' ? 'var(--primary-soft)' : 'linear-gradient(160deg,#2A2E2B,#434944)' }}>
                  {scan==='found' ? (
                    <div style={{ position:'absolute', inset:0, display:'flex', flexDirection:'column', alignItems:'center', justifyContent:'center', gap:8, color:'var(--primary)' }}>
                      <I.Check size={44}/><div style={{ fontWeight:700, fontSize:'0.875rem' }}>Code recognised</div>
                    </div>
                  ) : (
                    <div style={{ position:'absolute', inset:0, display:'flex', alignItems:'center', justifyContent:'center', color:'rgba(255,255,255,0.75)', fontSize:'0.75rem', textAlign:'center', padding:'0 30px', lineHeight:1.5 }}>
                      {scan==='scanning' ? 'Looking for a QR Ph code…' : 'Point your camera at a QR Ph code'}
                    </div>
                  )}
                </div>
                {scan==='found'
                  ? <button className="btn btn-ghost btn-block" style={{ marginTop:12 }} onClick={()=>setScan('idle')}>Scan a different code</button>
                  : <button className="btn btn-ghost btn-block" style={{ marginTop:12 }} disabled={scan==='scanning'}
                            onClick={()=>{ setScan('scanning'); setTimeout(()=>setScan('found'), 1400); }}><I.Camera size={16}/> {scan==='scanning'?'Scanning…':'Open camera to scan'}</button>}
                <p style={{ fontSize:'0.75rem', color:'var(--ink-3)', marginTop:10, lineHeight:1.5 }}>Demo only — no camera is opened. Scanning is simulated.</p>
              </div>
            )}
          </div>
        )}

        <div style={{ marginTop:18, padding:12, borderRadius:12, background:'var(--bg-elev)', border:'1px dashed var(--line)' }}>
          <div style={{ display:'flex', justifyContent:'space-between', fontSize:'0.875rem' }}>
            <span style={{ color:'var(--ink-3)' }}>Account</span><span className="mono">{acc.no} · {acc.label}</span>
          </div>
          <div style={{ display:'flex', justifyContent:'space-between', fontSize:'0.875rem', marginTop:4 }}>
            <span style={{ color:'var(--ink-3)' }}>Bill amount</span><span className="mono">₱{acc.amount.toFixed(2)}</span>
          </div>
          <div style={{ display:'flex', justifyContent:'space-between', fontSize:'0.875rem', marginTop:4 }}>
            <span style={{ color:'var(--ink-3)' }}>Service fee</span><span className="mono">₱{fee.toFixed(2)}</span>
          </div>
          <div style={{ display:'flex', justifyContent:'space-between', fontWeight:700, marginTop:8, paddingTop:8, borderTop:'1px solid var(--line)' }}>
            <span>Total</span><span className="mono">₱{total.toFixed(2)}</span>
          </div>
        </div>

        {(() => {
          const awaitingScan = picked==='qrph' && qrMode==='scan' && scan!=='found';
          const goPay = () => { if (picked==='qrph') { setStage('confirming'); setTimeout(()=>setStage('success'), 900); } else { setStage('gcash'); } };
          const label = awaitingScan ? 'Scan a code to continue'
            : picked==='qrph' && qrMode==='show' ? "I've paid — check for payment"
            : 'Continue with ' + (sel ? sel.name : '');
          return (
            <button className="btn btn-primary btn-block" style={{ marginTop:18, opacity:awaitingScan?0.5:1 }} disabled={awaitingScan} onClick={goPay}>{label}</button>
          );
        })()}
        <div style={{ textAlign:'center', fontSize:'0.75rem', color:'var(--ink-3)', marginTop:10 }}>
          {picked==='qrph' ? 'QR Ph works with any participating bank or e-wallet.' : "You'll be taken to your wallet to confirm."}
        </div>
      </div>

      {stage === 'gcash' && (
        <GCashSheet onClose={()=>setStage('select')} onPay={()=>{ setStage('confirming'); setTimeout(()=>setStage('success'), 900); }} amount={acc.amount}/>
      )}
      {stage === 'confirming' && <ConfirmingOverlay/>}
    </div>
  );
}

/* ── Business: Pay success + receipt ── */
function BizPaySuccess({ acc, nav, method, onPaid }) {
  useEffect(() => { onPaid(); }, []);
  const mName = method ? method.name : 'GCash';
  const paidVia = { GCash:'GCash · 09•• ••• 4567', Maya:'Maya · linked wallet', 'Online banking':'Online banking',
    'Credit or debit card':'Card · ••• 4242', 'QR Ph':'QR Ph', 'Cash payment':'Over the counter' }[mName] || mName;
  const ref = (method && method.id==='qrph' ? 'QRPH' : 'GC') + '-2026-04-B9YR5-' + acc.no.replace('BIZ-','').padStart(4,'0');
  return (
    <div className="eko-screen screen-enter">
      <div className="scroll" style={{ padding:'40px 22px 22px', textAlign:'center', display:'flex', flexDirection:'column' }}>
        <div style={{ width:78, height:78, margin:'30px auto 14px', borderRadius:'50%', background:'var(--primary-soft)', color:'var(--primary)', display:'flex', alignItems:'center', justifyContent:'center' }}>
          <I.Check size={44} sw={2}/>
        </div>
        <div className="eyebrow" style={{ color:'var(--primary)' }}>Payment successful</div>
        <div className="amount" style={{ fontSize:'2.75rem', marginTop:4 }}>₱{acc.amount.toFixed(2)}</div>
        <div style={{ color:'var(--ink-3)', fontSize:'0.875rem', marginTop:6 }}>{acc.label} bill is paid.</div>

        <div className="card" style={{ marginTop:26, padding:16, textAlign:'left' }}>
          {[
            ['Reference', ref],
            ['Paid via',  paidVia],
            ['Posted to', `${TENANT.code} · 2 mins`],
            ['Account',   `${acc.no} · ${acc.label}`],
            ['Bill',      `April 2026 · ${acc.period}`],
          ].map(([k,v], i) => (
            <div key={k} style={{ display:'flex', justifyContent:'space-between', padding:'10px 0', borderBottom: i < 4 ? '1px solid var(--line)' : 'none', fontSize:'0.875rem' }}>
              <span style={{ color:'var(--ink-3)', flexShrink:0 }}>{k}</span>
              <span className="mono" style={{ textAlign:'right', marginLeft:8, wordBreak:'break-all' }}>{v}</span>
            </div>
          ))}
        </div>

        <div style={{ marginTop:18 }}>
          <button className="btn btn-primary btn-block" onClick={()=>nav('home')}>Done</button>
          <button className="btn btn-ghost btn-block" style={{ marginTop:10 }}><I.Send size={16}/> Send receipt to email</button>
        </div>
      </div>
    </div>
  );
}

        </div>
        <div style={{marginTop:18,padding:'12px',background:'var(--eko-surface,#F4F1EA)',borderRadius:8,fontSize:'0.75rem',color:'#5F6B62',lineHeight:1.5,textAlign:'center'}}>
          This statement is computer-generated and does not require a signature.<br/>© 2026 {BRAND.legalName}. · All rights reserved.
        </div>
      </div>
    </div>
  );
}

/* ── Business: Pay All screen ── */
function BizPayAllScreen({ accounts, nav, onPaidAll }) {
  const unpaid = accounts.filter(a => !a.paid);
  const [selected, setSelected] = React.useState(() => new Set(unpaid.map(a => a.no)));
  const [stage, setStage] = React.useState('select');

  const allChecked = unpaid.every(a => selected.has(a.no));
  const toggle = (no) => setSelected(s => { const n = new Set(s); n.has(no) ? n.delete(no) : n.add(no); return n; });
  const toggleAll = () => setSelected(allChecked ? new Set() : new Set(unpaid.map(a => a.no)));

  const selectedAccounts = unpaid.filter(a => selected.has(a.no));
  const total = selectedAccounts.reduce((s, a) => s + a.amount, 0);

/* ── Business: root page ── */
function PageBusinessDashboard({ nav: parentNav }) {
  const [screen, setScreen] = useState('home');
  const [activeIdx, setActiveIdx] = useState(0);
  const [paidMap, setPaidMap] = useState({});
  const appNav = s => setScreen(s);
  const onPaid = (i) => setPaidMap(p => ({...p, [i]: true}));
  const onPaidAll = () => setPaidMap(p => { const m = {...p}; BUSINESS_DATA.accounts.forEach((_,i)=>{ m[i]=true; }); return m; });

  const accounts = BUSINESS_DATA.accounts.map((a, i) => ({...a, paid: a.paid || !!paidMap[i]}));
  const activeTab = { home:'home', accounts:'bill', bill:'bill', 'biz-bill-pdf':'bill', 'pay-all':'bill', pay:'bill', outage:'outage', service:'service', notif:'notif', energy:'service' }[screen] || 'home';

  const screenEl = (() => {
    switch(screen) {
      case 'home':    return <BizHomeScreen accounts={accounts} company={BUSINESS_DATA.company} activeIdx={activeIdx} setActiveIdx={setActiveIdx} nav={appNav}/>;
      case 'bill':    return <BizBillScreen accounts={accounts} activeIdx={activeIdx} setActiveIdx={setActiveIdx} nav={appNav}/>;
      case 'pay':     return <BizPayScreen  accounts={accounts} activeIdx={activeIdx} nav={appNav} onPaid={onPaid}/>;
      case 'accounts':     return <BizAccountsOverviewScreen accounts={accounts} setActiveIdx={setActiveIdx} nav={appNav}/>;
      case 'pay-all':      return <BizPayAllScreen   accounts={accounts} nav={appNav} onPaidAll={onPaidAll}/>;
      case 'biz-bill-pdf': return <BizBillPDFScreen  accounts={accounts} activeIdx={activeIdx} nav={appNav}/>;
      case 'outage':  return <OutageScreen  tenant={TENANT} nav={appNav}/>;
      case 'notif':   return <NotifScreen   nav={appNav}/>;
      case 'service': return <ServiceScreen nav={appNav}/>;
      case 'energy':  return <EnergyScreen  nav={appNav} data={BILL_DATA}/>;
      default:        return <BizHomeScreen accounts={accounts} company={BUSINESS_DATA.company} activeIdx={activeIdx} setActiveIdx={setActiveIdx} nav={appNav}/>;
    }
  })();

  const hideTab = screen === 'biz-bill-pdf';
  return (
    <div data-theme="light" data-tenant={BRAND.tenantKey} style={{height:'100%',display:'flex',flexDirection:'column'}}>
      <div style={{flex:1,minHeight:0,display:'flex',flexDirection:'column'}}>{screenEl}</div>
      {!hideTab && <div className="tabbar">
        <TabBtn icon={<I.Home size={20}/>}   label="Home"  id="home"    active={activeTab} onClick={()=>appNav('home')}/>

        <TabBtn icon={<I.Outage size={20}/>} label="Power" id="outage"  active={activeTab} onClick={()=>appNav('outage')}/>
        <TabBtn icon={<I.More size={20}/>}   label="More"  id="service" active={activeTab} onClick={()=>appNav('service')}/>
      </div>}
    </div>
  );
}

function PageRegister({ nav }) {
  const [step, setStep] = useState('account');
  const [data, setData] = useState({accNo:'',verifyMethod:'bill',billAmt:'',meterNo:'',mobile:'',otp:['','','','','',''],pass:'',pass2:''});
  const merge = p => setData(d=>({...d,...p}));
  const go = s => setStep(s);
  switch(step) {
    case 'account':  return <Reg1  data={data} merge={merge} onBack={()=>nav('home')}     onNext={()=>go('verify')} />;
    case 'verify':   return <Reg2  data={data} merge={merge} onBack={()=>go('account')}   onNext={()=>go('mobile')} />;
    case 'mobile':   return <Reg3  data={data} merge={merge} onBack={()=>go('verify')}    onNext={()=>go('otp')} />;
    case 'otp':      return <Reg4  data={data} merge={merge} onBack={()=>go('mobile')}    onNext={()=>go('password')} />;
    case 'password': return <Reg5  data={data} merge={merge} onBack={()=>go('otp')}       onNext={()=>go('success')} />;
    case 'success':  return <RegOK nav={nav} />;
    default:         return null;
  }
}

function Reg3({data,merge,onBack,onNext}) {

function Reg4({data,merge,onBack,onNext}) {
  const refs=[useRef(),useRef(),useRef(),useRef(),useRef(),useRef()];

        {data.otp.map((v,i)=><input key={i} ref={refs[i]} className="otp-box" value={v} maxLength={1} inputMode="numeric" onChange={e=>handleOtp(i,e.target.value)} onKeyDown={e=>{if(e.key==='Backspace'&&!v&&i>0)refs[i-1].current?.focus();}}/>)}
      </div>
      <div style={{textAlign:'center',marginBottom:18}}><span style={{fontSize:'0.875rem',color:C.ink,opacity:.65}}>Didn't get it? </span><span style={{fontSize:'0.875rem',fontWeight:700,color:C.current,cursor:'pointer',textDecoration:'underline'}}>Resend</span></div>

    </div>
  </div>);
}

function Reg5({data,merge,onBack,onNext}) {
  const [show,setShow]=useState(false);
  const strength=data.pass.length>=8?(data.pass.match(/[A-Z]/)&&data.pass.match(/[0-9]/)? 'Strong':'Good'):data.pass.length>0?'Weak':'';
  const sc={Strong:C.ok,Good:C.warn,Weak:C.alert}[strength]||C.rule;
  return(<div>
    <RegHeader title="Step 5 of 5 — Set password" step="password" onBack={onBack}/>
    <div style={{padding:'20px 18px'}}>
      <p style={{margin:'0 0 16px',fontSize:'1rem',color:C.ink,opacity:.75,lineHeight:1.55}}>Create a password you'll use to sign in. Keep it somewhere safe.</p>
      <label className="form-label">New password</label>
      <div style={{position:'relative',marginBottom:6}}>
        <input className="form-input" type={show?'text':'password'} placeholder="At least 8 characters" value={data.pass} onChange={e=>merge({pass:e.target.value})} style={{paddingRight:48}}/>
        <button onClick={()=>setShow(v=>!v)} style={{position:'absolute',right:12,top:'50%',transform:'translateY(-50%)',background:'none',border:0,cursor:'pointer',fontSize:'1.125rem',color:C.ink,opacity:.5}}>{show?'🙈':'👁'}</button>
      </div>
      {strength&&<div style={{display:'flex',alignItems:'center',gap:8,marginBottom:14}}><div style={{flex:1,height:4,borderRadius:999,background:C.rule,overflow:'hidden'}}><div style={{height:'100%',background:sc,width:strength==='Strong'?'100%':strength==='Good'?'66%':'33%',transition:'width 0.2s'}}/></div><span style={{fontSize:'0.75rem',fontWeight:700,color:sc}}>{strength}</span></div>}
      <label className="form-label" style={{marginTop:8}}>Confirm password</label>
      <input className="form-input" type="password" placeholder="Type it again" value={data.pass2} onChange={e=>merge({pass2:e.target.value})}/>
      {data.pass2&&data.pass!==data.pass2&&<div style={{fontSize:'0.875rem',color:C.alert,marginTop:5}}>Passwords do not match.</div>}
      <button className="btn-primary" style={{marginTop:22}} onClick={onNext} disabled={data.pass.length<8||data.pass!==data.pass2}>Create account →</button>
    </div>
  </div>);
}

function PageDashboard({ nav: parentNav }) {

  const activeTab={home:'home',bill:'bill','bill-pdf':'bill',outage:'outage',schedule:'outage',service:'service',energy:'service',meter:'service',profile:'service',notif:'notif',pay:'bill'}[screen]||'home';
  const isPdf = screen === 'bill-pdf';
  const screenEl=(()=>{
    switch(screen){
      case 'home':     return <HomeScreen tenant={TENANT} mode="on" conn="live" data={BILL_DATA} nav={appNav}/>;
      case 'bill':     return <BillScreen tenant={TENANT} data={BILL_DATA} nav={appNav}/>;

      case 'pay':      return <PayScreen  tenant={TENANT} data={BILL_DATA} nav={appNav}/>;

      case 'service':  return <ServiceScreen nav={appNav}/>;
      case 'energy':   return <EnergyScreen nav={appNav} data={BILL_DATA}/>;

  })();
  return(

      <div style={{flex:1,minHeight:0,display:'flex',flexDirection:'column'}}>{screenEl}</div>

      </div>}
    </div>
  );

/* ══════════ 2. BILLINGS — current bill, payment history, usage ══════════ */
function SAAccount({ nav, data }) {
  const [tab, setTab] = useState('bill');
  const max = Math.max(...data.usage);
  const months = ['Nov','Dec','Jan','Feb','Mar','Apr'];
  const totalUnpaid = data.bill.amount + (data.bill.prevBalance || 0);
  return (
    <div className="eko-screen screen-enter">
      <ScreenHeader title="Billings" onBack={()=>nav('sa-home')} action={<I.Receipt size={20}/>}/>
      <div className="scroll" style={{ padding:'8px 18px 20px' }}>
        {/* Green summary box — amount due, account no., due date, total unpaid */}
        <div style={{ background:'var(--primary)', color:'#fff', borderRadius:16, padding:'16px 18px' }}>
          <div style={{ display:'flex', justifyContent:'space-between', alignItems:'baseline' }}>
            <span style={{ fontSize:'0.75rem', letterSpacing:'0.1em', textTransform:'uppercase', opacity:.75 }}>Total amount due</span>
            <SAStatusPill status="Active"/>
          </div>
          <div className="amount" style={{ fontSize:'2.375rem', lineHeight:1, marginTop:6 }}>₱{data.bill.amount.toFixed(2)}</div>
          <div className="mono" style={{ fontSize:'0.875rem', opacity:.85, marginTop:6 }}>Account no. {BRAND.demoAccountNo}</div>
          <div style={{ display:'flex', gap:22, marginTop:14, paddingTop:12, borderTop:'1px solid rgba(255,255,255,0.22)' }}>
            <div>
              <div style={{ fontSize:'0.75rem', opacity:.7, letterSpacing:'0.06em', textTransform:'uppercase' }}>Latest due date</div>
              <div style={{ fontWeight:700, fontSize:'0.875rem', marginTop:2 }}>{data.bill.dueDate}</div>
            </div>
            <div>
              <div style={{ fontSize:'0.75rem', opacity:.7, letterSpacing:'0.06em', textTransform:'uppercase' }}>Total unpaid</div>
              <div className="mono" style={{ fontWeight:700, fontSize:'0.875rem', marginTop:2 }}>₱{totalUnpaid.toFixed(2)}</div>
            </div>
          </div>
        </div>

        {/* Pay actions sit directly under the green box — the main thing members come here to do */}
        <div style={{ display:'flex', gap:10, marginTop:12 }}>
          <button className="btn btn-primary" style={{ flex:1 }} onClick={()=>nav('pay')}><I.Bolt size={16}/> Pay ₱{data.bill.amount.toFixed(2)}</button>
          <button className="btn btn-ghost" onClick={()=>nav('wallet')}>Installment</button>
        </div>

        <div className="tabs" style={{ marginTop:14, borderBottom:'1px solid var(--line)', display:'flex', gap:0 }}>
          {[['bill','Current bill'],['history','Payment history'],['usage','Usage']].map(([id,lb])=>(
            <button key={id} onClick={()=>setTab(id)} style={{
              flex:1, padding:'10px 4px', background:'none', border:0, borderBottom:'2.5px solid '+(tab===id?'var(--primary)':'transparent'),
              color:tab===id?'var(--primary)':'var(--ink-3)', fontWeight:600, fontSize:'0.875rem', cursor:'pointer', fontFamily:'inherit', marginBottom:-1, whiteSpace:'nowrap',
            }}>{lb}</button>
          ))}
        </div>

        {tab==='bill' && (
          <div style={{ marginTop:14 }}>
            <div className="card" style={{ padding:18 }}>
              <div style={{ fontSize:'0.875rem', color:'var(--ink-2)' }}>Billing period {data.bill.period} · {data.bill.kwh} {data.unit}</div>
              <div style={{ fontSize:'0.875rem', color:'var(--ink-3)', marginTop:2 }}>Maria Santos · Residential · Meter {data.meter.meterNo}</div>
              <button className="btn" style={{ width:'100%', marginTop:14, background:'var(--bg-elev)', color:'var(--primary)', border:'1px solid var(--line)' }} onClick={()=>nav('bill-pdf')}><I.Receipt size={16}/> Download bill (PDF)</button>
              <div className="divider"/>
              <div className="eyebrow" style={{ marginBottom:4 }}>Charge breakdown</div>
              {data.bill.lines.map((l,i)=>(
                <div key={i} style={{ display:'flex', justifyContent:'space-between', fontSize:'0.875rem', padding:'5px 0' }}>
                  <span style={{ color:'var(--ink-2)' }}>{l.label}</span>
                  <span className="mono" style={{ color:l.amt<0?'var(--primary)':'var(--ink)' }}>₱{l.amt.toFixed(2)}</span>
                </div>
              ))}
            </div>
          </div>
        )}

        {tab==='history' && (
          <div className="card" style={{ marginTop:14 }}>
            {data.bill.history.map((h,i)=>(
              <div key={i} style={{ padding:'12px 14px', borderTop:i?'1px solid var(--line)':'none' }}>
                <div style={{ display:'flex', alignItems:'center', gap:8 }}>
                  <div style={{ flex:1, minWidth:0 }}>
                    <div style={{ fontWeight:600, fontSize:'1rem' }}>{h.month}</div>
                    <div style={{ fontSize:'0.875rem', color:'var(--ink-3)' }}>{h.kwh} {data.unit} · paid {h.paidOn}</div>
                  </div>
                  <span className="amount" style={{ fontSize:'1rem' }}>₱{h.amt.toFixed(2)}</span>
                  <SAStatusPill status="Paid"/>
                </div>
                <button onClick={()=>nav('bill-pdf')} style={{ width:'100%', marginTop:10, appearance:'none', background:'var(--bg-elev)', border:'1px solid var(--line)', color:'var(--primary)', borderRadius:10, padding:'8px 0', cursor:'pointer', fontFamily:'inherit', fontWeight:600, fontSize:'0.875rem', display:'flex', alignItems:'center', justifyContent:'center', gap:6 }}>
                  <I.Receipt size={14}/> View bill (PDF)
                </button>
              </div>
            ))}
          </div>
        )}

        {tab==='usage' && (
          <div className="card" style={{ padding:18, marginTop:14 }}>
            <div className="eyebrow">Consumption · last 6 months</div>
            <div style={{ display:'flex', alignItems:'flex-end', gap:8, marginTop:16 }}>
              {data.usage.map((v,i)=>(
                <div key={i} style={{ flex:1, display:'flex', flexDirection:'column', alignItems:'center', gap:5 }}>
                  <div className="mono" style={{ fontSize:'0.75rem', color:'var(--ink-3)' }}>{v}</div>
                  <div style={{ width:'100%', height:Math.round(v/max*90), background:i===data.usage.length-1?'var(--primary)':'var(--primary-soft)', borderRadius:'4px 4px 0 0' }}/>
                  <div style={{ fontSize:'0.75rem', color:'var(--ink-3)' }}>{months[i]}</div>
                </div>
              ))}
            </div>
            <div className="divider"/>
            <div style={{ display:'flex', justifyContent:'space-between', fontSize:'0.875rem' }}>
              <span style={{ color:'var(--ink-3)' }}>Avg / day</span><span className="mono">{data.rates.avgDaily} kWh</span>
            </div>
            <div style={{ display:'flex', justifyContent:'space-between', fontSize:'0.875rem', marginTop:6 }}>
              <span style={{ color:'var(--ink-3)' }}>vs same month last year</span><span className="mono" style={{ color:'var(--primary)' }}>{data.rates.vsLastYear}%</span>
            </div>
          </div>
        )}
      </div>
    </div>
  );
}

/* ══════════ Generic chat UI (used by support + AI assistant) ══════════ */
function SAChat({ nav, title, subtitle, headerColor, seed, botName, quicks, botReply }) {
  const [msgs, setMsgs] = useState(seed);
  const [text, setText] = useState('');
  const scRef = useRef();
  useEffect(()=>{ if(scRef.current) scRef.current.scrollTop = scRef.current.scrollHeight; }, [msgs]);
  const send = (t) => {
    const body = (t ?? text).trim();
    if(!body) return;
    setText('');
    setMsgs(m=>[...m, { from:'me', text:body }]);
    setTimeout(()=>setMsgs(m=>[...m, { from:'bot', text:botReply(body) }]), 650);
  };
  return (
    <div className="eko-screen screen-enter">
      <div style={{ display:'flex', alignItems:'center', gap:10, padding:'10px 12px', background:headerColor, color:'#fff', position:'sticky', top:0, zIndex:10 }}>
        <button onClick={()=>nav('sa-home')} style={{ appearance:'none', border:0, background:'transparent', color:'#fff', padding:6 }}><I.ChevronL size={22}/></button>
        <div style={{ width:36, height:36, borderRadius:'50%', background:'rgba(255,255,255,0.18)', display:'flex', alignItems:'center', justifyContent:'center' }}>{botName[0]}</div>
        <div style={{ flex:1, minWidth:0 }}>
          <div style={{ fontWeight:700, fontSize:'1rem', lineHeight:1.1 }}>{title}</div>
          <div style={{ fontSize:'0.75rem', opacity:.8, display:'flex', alignItems:'center', gap:5 }}><span style={{ width:6, height:6, borderRadius:999, background:'#7CE0A0' }}/>{subtitle}</div>
        </div>
      </div>
      <div className="scroll" ref={scRef} style={{ padding:'14px 16px', display:'flex', flexDirection:'column', gap:10, background:'var(--bg)' }}>
        {msgs.map((m,i)=>(
          <div key={i} style={{ display:'flex', justifyContent:m.from==='me'?'flex-end':'flex-start' }}>
            <div style={{
              maxWidth:'80%', padding:'10px 13px', borderRadius:16, fontSize:'0.875rem', lineHeight:1.45, whiteSpace:'pre-line',
              background:m.from==='me'?'var(--primary)':'var(--bg-elev)', color:m.from==='me'?'#fff':'var(--ink)',
              border:m.from==='me'?'none':'1px solid var(--line)',
              borderBottomRightRadius:m.from==='me'?4:16, borderBottomLeftRadius:m.from==='me'?16:4,
            }}>{m.text}</div>
          </div>
        ))}
      </div>
      <div style={{ borderTop:'1px solid var(--line)', background:'var(--bg-elev)' }}>
        {quicks && (
          <div className="chips" style={{ padding:'8px 12px 0' }}>
            {quicks.map(q=><button key={q} className="chip" onClick={()=>send(q)}>{q}</button>)}
          </div>
        )}
        <div style={{ display:'flex', gap:8, padding:'10px 12px', alignItems:'center' }}>
          <input value={text} onChange={e=>setText(e.target.value)} onKeyDown={e=>{if(e.key==='Enter')send();}}
            placeholder="Type a message…" style={{ ...SA_INPUT, borderRadius:999, padding:'11px 16px' }}/>
          <button onClick={()=>send()} style={{ width:44, height:44, borderRadius:'50%', border:0, background:'var(--primary)', color:'#fff', display:'flex', alignItems:'center', justifyContent:'center', flexShrink:0, cursor:'pointer' }}><I.Send size={18}/></button>
        </div>
      </div>
    </div>
  );
}

function SASupport({ nav }) {

      seed={[

        if(l.includes('reconnect')) return "Your reconnection request SR-2026-0398 was approved on Jun 30 and is scheduled for tomorrow between 8AM–12NN. A technician will call before arriving.";
        if(l.includes('bill')||l.includes('charge')) return "Happy to help with billing. Your April bill is ₱1,056.07, due May 20. Is your question about a specific line item, or would you like an installment plan?";
        if(l.includes('agent')) return "Connecting you to a live agent — average wait is about 3 minutes. You'll keep your place in line even if you close the app.";
        return "Got it — I've noted that for you. A support specialist will follow up shortly. Is there anything else I can help with?";
      }}
    />

}

/* Mock QR Ph code — deterministic pattern, so it looks like a real QR without encoding anything. */
function QRPhCode({ size = 172, seed = 'QRPH' }) {
  const N = 25, cell = size / N;
  let h = 0; for (let i = 0; i < seed.length; i++) h = (h * 31 + seed.charCodeAt(i)) >>> 0;
  const rnd = (i) => { const x = Math.sin(h + i * 12.9898) * 43758.5453; return x - Math.floor(x); };
  const isFinder = (r, c) =>
    (r < 7 && c < 7) || (r < 7 && c >= N-7) || (r >= N-7 && c < 7);
  const cells = [];
  for (let r = 0; r < N; r++) for (let c = 0; c < N; c++) {
    if (isFinder(r, c)) continue;
    if (rnd(r * N + c) > 0.52) cells.push(<rect key={r+'-'+c} x={c*cell} y={r*cell} width={cell} height={cell} fill="#111"/>);
  }
  const finder = (x, y) => (
    <g key={x+'-'+y}>
      <rect x={x*cell} y={y*cell} width={cell*7} height={cell*7} fill="#111"/>
      <rect x={(x+1)*cell} y={(y+1)*cell} width={cell*5} height={cell*5} fill="#fff"/>
      <rect x={(x+2)*cell} y={(y+2)*cell} width={cell*3} height={cell*3} fill="#111"/>
    </g>
  );
  return (
    <svg width={size} height={size} viewBox={`0 0 ${size} ${size}`} style={{ display:'block' }} role="img" aria-label="QR Ph payment code (mockup)">
      <rect width={size} height={size} fill="#fff"/>
      {cells}
      {finder(0,0)}{finder(N-7,0)}{finder(0,N-7)}
    </svg>
  );
}

/* ══════════ COLOR WHEEL — HSL picker used by Brand Studio ══════════ */
function hslToHex(h, s, l) {
  s /= 100; l /= 100;
  const k = n => (n + h / 30) % 12;
  const a = s * Math.min(l, 1 - l);
  const f = n => l - a * Math.max(-1, Math.min(k(n) - 3, Math.min(9 - k(n), 1)));
  const to = n => Math.round(255 * f(n)).toString(16).padStart(2, '0');
  return '#' + to(0) + to(8) + to(4);
}
function hexToHsl(hex) {
  const m = /^#?([a-f\d]{2})([a-f\d]{2})([a-f\d]{2})$/i.exec(hex || '');
  if (!m) return { h:0, s:0, l:50 };
  const r = parseInt(m[1],16)/255, g = parseInt(m[2],16)/255, b = parseInt(m[3],16)/255;
  const mx = Math.max(r,g,b), mn = Math.min(r,g,b), d = mx - mn;
  let h = 0;
  if (d) {
    if (mx === r) h = ((g - b) / d) % 6;
    else if (mx === g) h = (b - r) / d + 2;
    else h = (r - g) / d + 4;
    h = Math.round(h * 60); if (h < 0) h += 360;
  }
  const l = (mx + mn) / 2;
  return { h, s: Math.round((d ? d / (1 - Math.abs(2*l - 1)) : 0) * 100), l: Math.round(l * 100) };
}

/* Hue around the rim, saturation from centre out, lightness on the slider. */
function ColorWheel({ value, onChange, size = 172 }) {
  const ref = useRef();
  const { h, s, l } = hexToHsl(value);
  const lw = (l <= 2 || l >= 98) ? 50 : l;   /* keep the wheel readable at the extremes */
  const R = size / 2;
  const pick = (e) => {
    const box = ref.current.getBoundingClientRect();
    const dx = e.clientX - box.left - R, dy = e.clientY - box.top - R;
    const dist = Math.min(Math.sqrt(dx*dx + dy*dy), R);       /* clamp to the rim */
    let ang = Math.atan2(dx, -dy) * 180 / Math.PI; if (ang < 0) ang += 360;
    onChange(hslToHex(Math.round(ang), Math.round(dist / R * 100), lw));
  };
  const mx = R + Math.sin(h * Math.PI/180) * (s/100) * R;
  const my = R - Math.cos(h * Math.PI/180) * (s/100) * R;
  return (
    <div>
      <div ref={ref} onPointerDown={e=>{ ref.current.setPointerCapture(e.pointerId); pick(e); }}
           onPointerMove={e=>{ if (e.buttons === 1) pick(e); }}
           style={{ position:'relative', width:size, height:size, borderRadius:'50%', margin:'0 auto',
                    cursor:'crosshair', touchAction:'none', boxShadow:'inset 0 0 0 1px rgba(0,0,0,0.12)',
                    background:'radial-gradient(circle closest-side, #fff, rgba(255,255,255,0) 100%), conic-gradient(hsl(0,100%,50%), hsl(60,100%,50%), hsl(120,100%,50%), hsl(180,100%,50%), hsl(240,100%,50%), hsl(300,100%,50%), hsl(360,100%,50%))' }}>
        <div style={{ position:'absolute', left:mx, top:my, width:14, height:14, marginLeft:-7, marginTop:-7,
                      borderRadius:'50%', background:value, border:'2px solid #fff',
                      boxShadow:'0 0 0 1px rgba(0,0,0,0.35)', pointerEvents:'none' }}/>
      </div>
      <input type="range" min="0" max="100" value={l} onChange={e=>onChange(hslToHex(h, s, +e.target.value))}
             style={{ width:'100%', marginTop:10, accentColor:value }}/>
      <div style={{ fontSize:'0.75rem', color:'#888', textAlign:'center' }}>Lightness {l}% · {String(value).toUpperCase()}</div>
    </div>
  );
}

    applyBrandColors(); force(n=>n+1); onApply();
  };
  if (!open) return null;
  const fld = { display:'block', fontSize:'0.75rem', fontWeight:600, color:'#555', margin:'12px 0 4px', letterSpacing:'0.02em' };
  const inp = { width:'100%', padding:'8px 10px', border:'1px solid #ddd', borderRadius:8, fontSize:'0.875rem', fontFamily:'inherit', boxSizing:'border-box' };

        <div style={{ fontWeight:800, fontSize:'1rem' }}>🎨 Brand Studio</div>
        <button onClick={()=>setOpen(false)} style={{ border:'none', background:'#f0f0f0', borderRadius:8, width:28, height:28, cursor:'pointer', fontSize:'1rem' }}>✕</button>

      <input style={inp} value={BRAND.companyName} onChange={e=>upd({companyName:e.target.value})}/>

        <input style={inp} value={BRAND.primaryColor} onChange={e=>upd({primaryColor:e.target.value}, true)}/>
      </div>
      <label style={fld}>Accent color</label>

        <input style={inp} value={BRAND.accentColor} onChange={e=>upd({accentColor:e.target.value}, true)}/>
      </div>
      <label style={fld}>Top bar color</label>
      <div style={{ display:'flex', gap:8, alignItems:'center' }}>
        <input type="color" value={BRAND.navColor} onChange={e=>upd({navColor:e.target.value}, true)} style={{ width:44, height:36, border:'1px solid #ddd', borderRadius:8, background:'#fff', cursor:'pointer', padding:2 }}/>
        <input style={inp} value={BRAND.navColor} onChange={e=>upd({navColor:e.target.value}, true)}/>
      </div>
      <div style={{ fontSize:'0.75rem', color:'#888', marginTop:4, lineHeight:1.4 }}>Site header, slide-out menu, rate-table headings, footer and bill hero.</div>
      <label style={fld}>Surface tint (off-white)</label>
      <div style={{ display:'flex', gap:8, alignItems:'center' }}>
        <input type="color" value={BRAND.surfaceColor} onChange={e=>upd({surfaceColor:e.target.value}, true)} style={{ width:44, height:36, border:'1px solid #ddd', borderRadius:8, background:'#fff', cursor:'pointer', padding:2 }}/>
        <input style={inp} value={BRAND.surfaceColor} onChange={e=>upd({surfaceColor:e.target.value}, true)}/>

      <div style={{ fontSize:'0.75rem', color:'#888', marginTop:4, lineHeight:1.4 }}>Tinted cards, table stripes and hover states. Keep it near-white for readability.</div>

      <label style={fld}>Color wheel</label>
      <div style={{ display:'grid', gridTemplateColumns:'repeat(2,1fr)', gap:6, marginBottom:10 }}>
        {[['primaryColor','Primary'],['accentColor','Accent'],['navColor','Top bar'],['surfaceColor','Surface']].map(([k,lbl])=>(
          <button key={k} onClick={()=>setWheelTarget(k)} style={{ fontSize:'0.75rem', fontWeight:700, padding:'6px 0', borderRadius:8, cursor:'pointer',

            display:'flex', alignItems:'center', justifyContent:'center', gap:6 }}>
            <i style={{ width:10, height:10, borderRadius:3, background:BRAND[k], border:'1px solid rgba(0,0,0,0.15)' }}/>{lbl}
          </button>
        ))}
      </div>
      <ColorWheel value={BRAND[wheelTarget]} onChange={hex=>upd({ [wheelTarget]: hex }, true)}/>

      <label style={fld}>Quick presets</label>
      <div style={{ display:'flex', gap:6, flexWrap:'wrap' }}>
        {presets.map(p=>(
          <button key={p[1]} onClick={()=>upd({companyName:p[0],shortName:p[1],primaryColor:p[2],accentColor:p[3],logoUrl:''}, true)} style={{ fontSize:'0.75rem', padding:'6px 10px', borderRadius:999, border:'1px solid #ddd', background:'#fafafa', cursor:'pointer' }}>{p[1]}</button>
        ))}
      </div>

      <button onClick={reset} style={{ width:'100%', marginTop:18, padding:'10px', border:'1px solid #ddd', background:'#fff', borderRadius:8, cursor:'pointer', fontWeight:600, fontSize:'0.875rem' }}>Reset to EcoKo</button>
    </div>
  );
}

function App() {
  const [page, setPage] = useState('signin');
  const [, setTick] = useState(0);
  const rebrand = useCallback(() => setTick(t=>t+1), []);
  const nav = useCallback(p => setPage(p), []);
  const siteRef = useRef();

  useEffect(() => { if(siteRef.current) siteRef.current.scrollTop = 0; }, [page]);

  /* Live white-label: substitute the "EcoKo" placeholder name with the chosen brand
     everywhere in the rendered app (runs before paint, so no flicker). */
  React.useLayoutEffect(() => {
    const name = BRAND.shortName;
    const root = siteRef.current;
    if (!root || !name || name === 'EcoKo') return;
    const w = document.createTreeWalker(root, NodeFilter.SHOW_TEXT);
    const nodes = []; while (w.nextNode()) nodes.push(w.currentNode);
    nodes.forEach(n => { if (n.nodeValue.indexOf('EcoKo') >= 0) n.nodeValue = n.nodeValue.split('EcoKo').join(name); });
  });

  const pageEl = (() => {
    switch(page) {
      case 'home':             return <PageHome nav={nav}/>;
      case 'about':            return <PageAbout nav={nav}/>;
      case 'rates-residential':return <PageRatesResidential nav={nav}/>;
      case 'rates-generation': return <PageRatesGeneration nav={nav}/>;
      case 'rates-unbundled':  return <PageRatesUnbundled nav={nav}/>;
      case 'news':             return <PageNews nav={nav}/>;
      case 'contact':          return <PageContact nav={nav}/>;
      case 'signin':            return <PageSignIn nav={nav}/>;
      case 'register':          return <PageRegister nav={nav}/>;
      case 'dashboard':         return <PageSuperApp nav={nav}/>;
      case 'business-dashboard':return <PageBusinessDashboard nav={nav}/>;
      default:                  return <PageSignIn nav={nav}/>;
    }
  })();

  const isDash = page==='dashboard' || page==='business-dashboard';
  const urlFull = PAGE_LABELS[page] || BRAND.website;
  const urlPath = urlFull.replace(BRAND.website, '');

  return (
    <div className="canvas">
      <BrandStudio onApply={rebrand}/>
      {/* Android phone shell */}
      <div className="phone-body">

        {/* Android status bar */}
        <div className="android-status">
          <span className="time">9:41</span>
          <div className="sys-icons">
            {/* Signal bars */}
            <svg width="15" height="11" viewBox="0 0 15 11" fill="#111">
              <rect x="0" y="5" width="2.5" height="6" rx="0.4"/>
              <rect x="3.5" y="3.5" width="2.5" height="7.5" rx="0.4"/>
              <rect x="7" y="2" width="2.5" height="9" rx="0.4"/>
              <rect x="10.5" y="0" width="2.5" height="11" rx="0.4"/>
            </svg>
            {/* Wi-Fi */}
            <svg width="14" height="11" viewBox="0 0 14 11" fill="#111">
              <path d="M7 8.5a1.2 1.2 0 1 1 0 2.4 1.2 1.2 0 0 1 0-2.4z"/>
              <path d="M3.4 6.1C4.5 5.1 5.7 4.6 7 4.6s2.5.5 3.6 1.5l1.2-1.2C10.4 3.7 8.8 3 7 3S3.6 3.7 2.2 4.9z"/>
              <path d="M0.8 3.5C2.5 1.9 4.6 1 7 1s4.5.9 6.2 2.5l1.1-1.1C12.4.9 9.9 0 7 0S1.6.9-.3 2.4z" opacity=".4"/>
            </svg>
            {/* Battery */}
            <svg width="22" height="11" viewBox="0 0 22 11" fill="none">
              <rect x="0.5" y="0.5" width="18.5" height="10" rx="2" stroke="#111" strokeWidth="1"/>
              <rect x="19.5" y="3.2" width="2" height="4.6" rx="1" fill="#111"/>
              <rect x="2" y="2" width="14" height="7" rx="1" fill="#111"/>
            </svg>
          </div>
        </div>

        {/* Chrome URL bar */}
        <div className="chrome-urlbar">
          <div className="chrome-url-pill">
            <span className="lock-icon">🔒</span>
            <span className="url-text"><strong>{BRAND.website}</strong>{urlPath}</span>
          </div>
          <button className="chrome-tab-btn">1</button>
          <span className="chrome-more">⋮</span>
        </div>

        {/* Site content */}
        <div className="site" ref={siteRef} style={{position:'relative', height:652, display: isDash ? 'flex' : 'block', flexDirection: isDash ? 'column' : undefined, overflowY: isDash ? 'hidden' : 'auto'}}>
          <SiteNav nav={nav} currentPage={page} loggedIn={isDash}/>
          <div style={isDash ? {flex:1, minHeight:0, overflow:'hidden'} : {}}>
          {pageEl}
          </div>
        </div>

        {/* Chrome bottom bar */}
        <div className="chrome-bottom">
          <button title="Back" disabled>&#8592;</button>
          <button title="Forward" disabled>&#8594;</button>
          <button title="Home" onClick={()=>nav('signin')} style={{fontSize:'1.125rem'}}>⊙</button>
          <button title="Tabs"><div className="tab-badge">1</div></button>
          <button title="More">⋮</button>
        </div>

        {/* Android gesture bar */}
        <div className="android-gesture">
          <div className="gesture-pill"/>
        </div>
      </div>

      {/* Page nav pills — outside the phone frame, for prototype navigation */}
      <div className="page-nav">
        {NAV_PILLS.map(p=>(
          <button key={p.id} className="page-pill" onClick={()=>nav(p.id)} style={{
            background:page===p.id?C.ocean:'#fff',
            color:page===p.id?'#fff':C.ocean,
          }}>{p.label}</button>
        ))}
      </div>
    </div>
  );
}

function boot() {
  if(!window.HomeScreen||!window.I) return setTimeout(boot, 30);
  ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
}
boot();

window.generateBillPDF = function() {
  const el = document.querySelector('.bill-pdf');
  if (!el || !window.html2pdf) return window.print();
  html2pdf().set({
    margin: 10,
    filename: BRAND.shortName+'-Bill.pdf',
    image: { type: 'jpeg', quality: 0.98 },
    html2canvas: { scale: 2 },
    jsPDF: { unit: 'mm', format: 'a4', orientation: 'portrait' },
  }).from(el).save();
};
</script>
</body>
